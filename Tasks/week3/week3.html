<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./../../reset.css">
  <link rel="stylesheet" href="./styles.css">

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <title>Завдання 3</title>
</head>
<body>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
  <!-- renderer="logarithmicDepthBuffer: true;" -->

  <a-marker preset="hiro">

    <a-entity
      scale="0.3 0.3 0.3"
      rotation="-90 0 0"
    >

      <a-torus
        position="-2 1 -5"
        color="green"
        radius="1.2"
        animation="
          property: components.material.material.color;
          type: color;
          from: green;
          to: red;
          loop: true;
          dur: 10000
        ">
      </a-torus>

      <a-cylinder
        color="yellow"
        height="2"
        radius="0.05"
        position="-2 -1 -5">
      </a-cylinder>

      <a-cylinder
        color="blue"
        height="2"
        radius="0.05"
        position="-3 -1 -5">
      </a-cylinder>

      <a-torus-knot
        color="orange"
        radius="1.2"
        position="-3 1 -5"
        animation="
          property: rotation;
          to: 0 0 360;
          loop: true;
          dur: 10000">
      </a-torus-knot>

      <a-plane
        width="9"
        height="2"
        position="3 1 -9"
      >
      </a-plane>

      <a-text
        value="Вітаємо у браузерній AR!"
        color="black"
        width="10"
        position="-0.5 1 -8.5"
        font="./../../resources/RoadUI-Medium-msdf.json"
        negate="false"
      >
      </a-text>


      <a-plane
        src="./images/image.png"
        width="7"
        height="7"
        rotation="-55 0 0"
        position="-2 -2 -5">
      </a-plane>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
